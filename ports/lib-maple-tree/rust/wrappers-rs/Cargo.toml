[package]
name = "wrappers-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `wrappers.c`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Export only the `rust_anything_` names, to link beside the original C code.
shadow = []

[dependencies]
maple-model = { path = "../maple-model" }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]

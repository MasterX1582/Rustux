[package]
name = "genradix-interval-model"
version = "0.1.0"
edition = "2024"
publish = false
description = "Safe Rust models of upstream lib/generic-radix-tree.c and lib/interval_tree.c (canonical index/pool model) for the lib-genradix-interval port"

[lib]
crate-type = ["rlib"]

[dependencies]
klib = { path = "../../../../klib" }

[lints.clippy]
all = { level = "warn", priority = -1 }

